name: NeuroWatch Finalize Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - neurowatch-finalize-v11
    paths:
      - 'firmware/**'
      - 'scripts/patch_neurowatch_installer.py'
      - 'scripts/patch_finalize_recovery.py'
      - '.github/workflows/android-finalize-recovery.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pyserial

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core and Watchy libraries
        shell: bash
        run: |
          set -euo pipefail
          INDEX=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install esp32:esp32@2.0.15 --additional-urls "$INDEX"
          arduino-cli lib install 'Watchy@1.4.7'
          arduino-cli lib install 'DS3232RTC@2.0.1'
          arduino-cli lib install 'WiFiManager@2.0.17'

      - name: Build NeuroWatch OS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build installer-assets
          arduino-cli compile \
            --fqbn 'esp32:esp32:watchy:Revision=v20,PartitionScheme=min_spiffs' \
            --build-path "$PWD/build" \
            firmware/NeuroWatch_OS
          APP=build/NeuroWatch_OS.ino.bin
          test -s "$APP"
          python3 scripts/check_ota.py "$APP"
          cp "$APP" installer-assets/app.bin
          sha256sum installer-assets/app.bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare recovery app
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/drakosha/esp-flash-android.git android-installer
          cd android-installer
          git checkout c4036ace9d2f5526e3535d1ac8bfb8ac3bafc23d
          cd ..
          python3 scripts/patch_neurowatch_installer.py android-installer
          python3 scripts/patch_finalize_recovery.py android-installer
          cp installer-assets/app.bin android-installer/app/src/main/assets/
          cat > android-installer/app/src/main/assets/firmware.json <<'JSON'
          {
            "name": "NeuroWatch OS Finalize Recovery",
            "version": "v1.1",
            "parts": [
              { "file": "app.bin", "offset": "0x10000" }
            ]
          }
          JSON

      - name: Bundle Espressif esptool-js 0.6.1
        working-directory: android-installer
        env:
          ESPTOOL_VERSION: '0.6.1'
        run: ./scripts/bundle-esptool.sh

      - name: Verify recovery invariants
        shell: bash
        working-directory: android-installer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h = Path("app/src/main/assets/flash.html").read_text()
          assert "ПРОВЕРИТЬ И ЗАПУСТИТЬ NEUROWATCH OS" in h
          assert "async function verifyApp(loader, expected, appLength)" in h
          assert "flashMd5sum(0x10000, appLength)" in h
          assert "verifyApp(session.loader, expected, app.length)" in h
          assert "writeFlashRaw(" in h
          assert "address: 0x10000" in h
          assert "Android.setSignals(1, 0)" in h
          assert "Android.setSignals(0, 0)" in h
          assert "eraseFlash()" not in h[h.index("async function doFlash() {"):h.index("\nasync function doErase()", h.index("async function doFlash() {"))]
          s = h[h.index("<script>")+8:h.rindex("</script>")]
          Path("/tmp/neurowatch-finalize.js").write_text(s)
          PY
          node --check /tmp/neurowatch-finalize.js
          test -s app/src/main/assets/app.bin

      - name: Build APK
        shell: bash
        working-directory: android-installer
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug \
            -PappId=ru.neurogazette.neurowatchfinalize \
            -PappLabel='NeuroWatch Finalize' \
            -PversionName=1.1 \
            -PversionCode=2
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/NeuroWatch-Finalize-v1.1.apk
          cp app/src/main/assets/app.bin ../release/app.bin
          (cd ../release && sha256sum *.apk *.bin > SHA256SUMS.txt)
          printf '%s\n' \
            'Recovery/finalize utility for a watch whose full reinstall already erased factory flash.' \
            'It verifies app.bin at 0x10000, rewrites only app.bin if needed, then performs a normal-boot reset.' \
            'It does not erase the full flash and does not rewrite bootloader/partition table.' \
            > ../release/READ_FIRST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroWatch-Finalize-v1.1
          path: release/
          if-no-files-found: error
