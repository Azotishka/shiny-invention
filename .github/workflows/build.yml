name: NeuroWatch v0.7 Daily UX
on:
  push:
    paths:
      - 'firmware/**'
      - 'studio/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Preflight test suite
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: arduino/setup-arduino-cli@v2
      - name: Install locked board core and libraries
        shell: bash
        run: |
          set -euo pipefail
          INDEX=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install esp32:esp32@2.0.15 --additional-urls "$INDEX"
          arduino-cli lib install 'Watchy@1.4.7'
          # WatchyRTC::WatchyRTC() uses the pre-v3 DS3232RTC constructor.
          arduino-cli lib install 'DS3232RTC@2.0.1'
          arduino-cli lib install 'WiFiManager@2.0.17'
          arduino-cli board details -b 'esp32:esp32:watchy'
      - name: Build watch-only application image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build release
          arduino-cli compile --fqbn 'esp32:esp32:watchy:Revision=v20,PartitionScheme=min_spiffs' --build-path "$PWD/build" firmware/NeuroWatch_OS
          IMAGE=build/NeuroWatch_OS.ino.bin
          test -s "$IMAGE"
          python3 scripts/check_ota.py "$IMAGE"
          cp "$IMAGE" release/NeuroWatch-OS-v0.7-Watchy-V2-APP.bin
          sha256sum release/*.bin > release/SHA256SUMS.txt
          printf '%s\n' 'v0.7 app-only image for the confirmed Watchy V2 / ESP32-PICO-D4 4MB platform. Use the NeuroWatch USB updater; bootloader and partition table are not part of this artifact.' > release/READ_BEFORE_FLASHING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroWatch-v0.7-Daily-UX
          path: release/
          if-no-files-found: error
