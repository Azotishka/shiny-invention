name: NeuroWatch Android Safe Installer

on:
  workflow_dispatch:
  push:
    branches:
      - neurowatch-installer-v20
    paths:
      - 'firmware/**'
      - 'scripts/patch_neurowatch_installer.py'
      - '.github/workflows/android-installer.yml'

permissions:
  contents: read

concurrency:
  group: neurowatch-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools required by ESP32 core
        run: python -m pip install --disable-pip-version-check pyserial

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core and Watchy libraries
        shell: bash
        run: |
          set -euo pipefail
          INDEX=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install esp32:esp32@2.0.15 --additional-urls "$INDEX"
          arduino-cli lib install 'Watchy@1.4.7'
          arduino-cli lib install 'DS3232RTC@2.0.1'
          arduino-cli lib install 'WiFiManager@2.0.17'

      - name: Build NeuroWatch OS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build installer-assets
          arduino-cli compile \
            --fqbn 'esp32:esp32:watchy:Revision=v20,PartitionScheme=min_spiffs' \
            --build-path "$PWD/build" \
            firmware/NeuroWatch_OS
          python3 scripts/check_ota.py build/NeuroWatch_OS.ino.bin
          cp build/NeuroWatch_OS.ino.bin installer-assets/app.bin
          ls -lh installer-assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare pinned Android flasher
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/drakosha/esp-flash-android.git android-installer
          cd android-installer
          git checkout c4036ace9d2f5526e3535d1ac8bfb8ac3bafc23d
          cd ..
          python3 scripts/patch_neurowatch_installer.py android-installer
          cp installer-assets/app.bin android-installer/app/src/main/assets/
          cat > android-installer/app/src/main/assets/firmware.json <<'JSON'
          {
            "name": "NeuroWatch OS",
            "version": "v2.0 Device Manager",
            "parts": [
              { "file": "app.bin", "offset": "0x0" }
            ]
          }
          JSON

      - name: Bundle Espressif esptool-js 0.6.1
        shell: bash
        working-directory: android-installer
        env:
          ESPTOOL_VERSION: '0.6.1'
        run: ./scripts/bundle-esptool.sh

      - name: Verify final installer safety invariants
        shell: bash
        working-directory: android-installer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h = Path("app/src/main/assets/flash.html").read_text()
          assert h.count("async function doFlash() {") == 1
          assert "async function openChipRom()" in h
          assert "ROM read flash block" in h
          assert "flashMd5sum(choice.target.offset, app.length)" in h
          assert "Bootloader, таблица разделов и текущая заводская прошивка НЕ будут перезаписаны." in h
          assert "async function makeFactoryBackup(session)" not in h
          assert "addEventListener('click', doErase)" not in h
          assert "Автовход в ROM bootloader не удался после 9 попыток" in h
          assert "0x3FF5A000" in h and "0x3FF5A018" in h
          assert "putU32le(sector, 24, 0xFFFFFFFF)" in h
          assert "async function attachEsp32FlashRom(loader)" in h
          assert "ROM SPI attach (8-byte ESP32 packet)" in h
          assert "new Uint8Array([0, 0, 0, 0])" in h
          assert "setInterval(__refreshNeuroWatchUsb, 1200)" in h
          assert "function neuroWatchUsbDiagnostics()" in h
          assert "usbRefreshBtn" in h and "usbPermissionBtn" in h
          assert "setInterval(neuroWatchUsbDiagnostics, 1500)" in h
          assert "async function doReadOnlyPreflight()" in h
          assert "preflightBtn" in h
          assert "window.__preflightPassed = false" in h
          assert "ПРОВЕРИТЬ ЧАСЫ БЕЗ ЗАПИСИ" in h
          assert "copyDiagBtn" in h
          assert "СКОПИРОВАТЬ ДИАГНОСТИКУ" in h
          # The safe ROM path must not use esptool-js 0.6.1's 4-byte flashSpiAttach helper.
          safe = h[h.index("async function connectRomWithSignalSequence"):h.index("// ─── Прошивка")]
          assert ".flashSpiAttach(0)" not in safe

          usb = Path("app/src/main/java/io/github/drakosha/espflash/UsbSerialManager.kt").read_text()
          assert "setBridgeSignalsAtomic" in usb
          assert "controlTransfer(" in usb
          assert "requestType, 0x22" in usb
          assert "controlTransfer(requestType, 0xA4" in usb
          assert "device?.vendorId == 0x1A86 && device.productId == 0x55D4" in usb
          assert "driverName.contains(\"CdcAcm\"" in usb
          assert "it.vendorId == 0x1A86 && it.productId == 0x55D4" in usb
          assert "serialDriverFor(device)" in usb
          assert "CdcAcmSerialDriver::class.java" in usb
          assert "fun diagnosticsJson(): String" in usb
          assert "private fun closeTransport()" in usb
          assert "usbConnection?.close()" in usb
          assert "closeTransport()" in usb

          bridge = Path("app/src/main/java/io/github/drakosha/espflash/JsBridge.kt").read_text()
          assert "fun requestUsbPermission(): String" in bridge
          assert "fun usbDiagnostics(): String" in bridge
          assert "fun copyText(label: String, text: String): String" in bridge
          # v2 polling must not spam Android permission dialogs.
          cc_start = bridge.index("fun checkConnection(): String")
          cc_end = bridge.index("\n    @JavascriptInterface", cc_start)
          cc = bridge[cc_start:cc_end]
          assert "requestPermission" not in cc

          gradle = Path("app/build.gradle").read_text()
          assert "usb-serial-for-android:3.7.3" in gradle

          s = h[h.index("<script>")+8:h.rindex("</script>")]
          Path("/tmp/neurowatch-flash.js").write_text(s)

          # Extract pure OTA-selection helpers for behavioral tests.
          hs = h.index("function u16le")
          he = h.index("// ─── Прошивка", hs)
          Path("/tmp/neurowatch-ota-helpers.js").write_text(h[hs:he])
          PY
          node --check /tmp/neurowatch-flash.js
          cat /tmp/neurowatch-ota-helpers.js ../scripts/test_installer_ota.js > /tmp/neurowatch-ota-test.js
          node /tmp/neurowatch-ota-test.js
          test -f app/src/main/assets/app.bin
          test ! -f app/src/main/assets/bootloader.bin
          test ! -f app/src/main/assets/partitions.bin
          test ! -f app/src/main/assets/boot_app0.bin
          grep -q '"file": "app.bin"' app/src/main/assets/firmware.json
          ! grep -q 'bootloader.bin' app/src/main/assets/firmware.json

      - name: Build installer APK
        shell: bash
        working-directory: android-installer
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug \
            -PappId=ru.neurogazette.neurowatchinstaller \
            -PappLabel='NeuroWatch Manager' \
            -PversionName=2.0 \
            -PversionCode=20
          mkdir -p ../release-installer
          cp app/build/outputs/apk/debug/app-debug.apk ../release-installer/NeuroWatch-Manager-v2.0.apk
          (cd ../release-installer && sha256sum NeuroWatch-Manager-v2.0.apk > SHA256SUMS.txt)
          printf '%s\n' \
            'NeuroWatch Manager v2.0 for the detected ESP32-PICO-D4 / 4MB + CH9102 platform.' \
            'USB detection is diagnostic-first: raw Android enumeration is visible, USB permission is explicit, CH9102 has a CDC fallback driver, and stale USB handles are always closed before reconnect.' \
            'The app separates raw USB diagnostics from flashing: installation stays disabled until the exact watch, permission, and serial driver are all ready.' \
            'A read-only hardware preflight must successfully identify the ESP32 and validate the factory partition/OTA layout before the Install button can be enabled.' \
            'It validates security eFuses, backs up partition table + OTA metadata, writes only an inactive OTA app slot, verifies it by MD5, then switches OTA metadata.' \
            'It does NOT package or overwrite the bootloader or partition table, and destructive full-flash erase is disabled in the UI.' \
            'If preflight, read, write, or MD5 verification fails before OTA switch, the existing active system remains selected.' \
            > ../release-installer/READ_FIRST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroWatch-Manager-Android-v2.0
          path: release-installer/
          if-no-files-found: error
