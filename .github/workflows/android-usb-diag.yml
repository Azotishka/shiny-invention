name: NeuroWatch Android USB Diagnostic

on:
  push:
    branches:
      - android-usb-diagnostic
    paths:
      - 'android/NeuroWatchUsbDiag/**'
      - '.github/workflows/android-usb-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build read-only diagnostic APK
        working-directory: android/NeuroWatchUsbDiag
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroWatch-USB-Diagnostic-Android
          path: android/NeuroWatchUsbDiag/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
